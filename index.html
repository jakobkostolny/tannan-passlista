<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Räkning bilar över Tännån — passlista</title>
<style>
  :root{
    --paper: #F6F2E7;
    --ink: #2B2B26;
    --ink-soft: #5C5A4F;
    --green: #2F4A38;
    --green-deep: #1E3326;
    --sage: #D8E2CC;
    --sage-line: #A9BC95;
    --orange: #C75A28;
    --orange-deep: #8E3E1B;
    --line: #D8D2C0;
    --card: #FFFDF7;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', Arial, sans-serif;
    line-height:1.5;
    padding-bottom: 4rem;
  }
  @font-face{ }
  .wrap{ max-width: 760px; margin: 0 auto; padding: 0 1.25rem; }

  header.top{
    background: var(--green-deep);
    color: #F1EEE0;
    padding: 2.2rem 1.25rem 2.6rem;
    border-bottom: 6px solid var(--orange);
  }
  header.top .wrap{ position:relative; }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #BFD2B3;
    margin: 0 0 0.5rem;
  }
  h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 2rem;
    margin: 0 0 0.35rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .sub{
    color: #CBD6BE;
    font-size: 0.95rem;
    margin: 0;
    max-width: 46ch;
  }

  .counter-row{
    margin-top: 1.6rem;
    display:flex;
    align-items: center;
    gap: 1rem;
    font-family: 'IBM Plex Mono', monospace;
  }
  .odometer{
    display:flex;
    gap: 3px;
    background: var(--green-deep);
    padding: 4px;
  }
  .digit{
    width: 26px;
    height: 36px;
    background: #11200F;
    color: #C9F0AE;
    font-size: 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    border: 1px solid #0A1607;
  }
  .counter-label{
    font-size: 12px;
    color: #BFD2B3;
    letter-spacing: 0.04em;
  }

  main{ padding-top: 1.75rem; }

  .week{
    margin-bottom: 1.1rem;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 10px;
    overflow: hidden;
  }
  .week-head{
    width:100%;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.95rem 1.1rem;
    background: var(--card);
    border: none;
    cursor: pointer;
    text-align:left;
    font-family: inherit;
  }
  .week-head:hover{ background: #FBF8EF; }
  .week-title{
    display:flex;
    align-items:baseline;
    gap: 0.6rem;
  }
  .week-title .label{
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    color: var(--green-deep);
    font-size: 0.95rem;
  }
  .week-title .range{
    color: var(--ink-soft);
    font-size: 0.85rem;
  }
  .week-meta{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .chev{
    transition: transform 0.15s ease;
    color: var(--ink-soft);
    font-size: 0.8rem;
  }
  .week.open .chev{ transform: rotate(90deg); }
  .week-body{
    display:none;
    border-top: 1px solid var(--line);
    padding: 0.4rem 1.1rem 0.9rem;
  }
  .week.open .week-body{ display:block; }

  .day{
    margin: 0.4rem 0;
  }
  .day-head{
    width:100%;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 0.6rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    color: var(--green-deep);
    font-weight: 600;
    margin: 0;
    padding: 0.6rem 0.2rem;
    border-top: 1px dashed var(--line);
    background: none;
    border-left: none;
    border-right: none;
    border-bottom: none;
    cursor: pointer;
    text-align: left;
  }
  .day-head:hover{ color: var(--orange-deep); }
  .day:first-child .day-head{ border-top:none; }
  .day-meta{
    display:flex;
    align-items:center;
    gap: 0.6rem;
    font-weight: 400;
    color: var(--ink-soft);
    font-size: 0.78rem;
  }
  .day-chev{
    transition: transform 0.15s ease;
    display:inline-block;
  }
  .day.open .day-chev{ transform: rotate(90deg); }
  .day .pass-list{ display:none; }
  .day.open .pass-list{ display:block; }

  .pass-card{
    padding: 0.7rem 0;
    border-bottom: 1px dotted var(--line);
  }
  .pass-card:last-child{ border-bottom:none; }
  .pass-head{
    display:flex;
    align-items:baseline;
    gap: 0.5rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-bottom: 0.4rem;
  }
  .pass-head .pnr{ color: var(--green-deep); font-weight: 600; }

  .slot-filled{
    background: var(--sage);
    border: 1px solid var(--sage-line);
    border-radius: 8px;
    padding: 0.55rem 0.7rem;
    display:flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.6rem;
    font-size: 0.88rem;
  }
  .slot-filled .name{ font-weight: 700; color: var(--green-deep); display:block; margin-bottom: 0.25rem; }
  .slot-filled .counts{ color: var(--ink-soft); font-size: 0.82rem; line-height: 1.5; }
  .slot-actions{
    display:flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.35rem;
  }
  .edit-btn{
    background: none;
    border: none;
    color: var(--green-deep);
    cursor: pointer;
    font-size: 0.78rem;
    text-decoration: underline;
    padding: 0;
    font-family: inherit;
    white-space: nowrap;
  }
  .edit-btn:hover{ color: var(--orange-deep); }
  .remove-btn{
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 0.78rem;
    text-decoration: underline;
    padding: 0;
    font-family: inherit;
    white-space: nowrap;
  }
  .remove-btn:hover{ color: var(--orange-deep); }

  .field-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem 0.6rem;
  }
  .field-grid .field-full{ grid-column: 1 / -1; }
  .field label{
    display:block;
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin-bottom: 0.2rem;
  }
  .field input{
    width:100%;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.4rem 0.5rem;
    font-size: 0.9rem;
    font-family: inherit;
    background: #FFFDF7;
  }
  .field input:focus{ outline: 2px solid var(--sage-line); border-color: var(--green); }
  .save-btn{
    background: var(--orange);
    color: #FFF8EF;
    border: none;
    border-radius: 6px;
    padding: 0.45rem 0.9rem;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    margin-top: 0.55rem;
    width:100%;
  }
  .save-btn:hover{ background: var(--orange-deep); }
  .save-btn:disabled{ opacity: 0.45; cursor: default; }
  .form-actions{
    display:flex;
    gap: 0.5rem;
    margin-top: 0.55rem;
  }
  .form-actions .save-btn{ margin-top:0; flex:1; }
  .cancel-btn{
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: 6px;
    padding: 0.45rem 0.9rem;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .cancel-btn:hover{ background: #FBF8EF; }

  .pass-head .spacer{ flex:1; }
  .badge{
    font-size: 0.72rem;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    white-space: nowrap;
    font-weight: 600;
  }
  .badge-booked{ background: #F6E3CF; color: var(--orange-deep); border: 1px solid #E5BE98; }
  .badge-done{ background: var(--sage); color: var(--green-deep); border: 1px solid var(--sage-line); }
  .book-btn{
    background: var(--green);
    color: #F1EEE0;
    border: none;
    border-radius: 6px;
    padding: 0.3rem 0.9rem;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .book-btn:hover{ background: var(--green-deep); }
  .free-label{ color: var(--ink-soft); font-size: 0.8rem; font-style: italic; }
  .slot-filled.booked{ background: #FBF1E6; border-color: #E5BE98; }
  .missing{ color: var(--orange-deep); font-size: 0.82rem; }
  .report-btn{
    background: var(--orange);
    color: #FFF8EF;
    border: none;
    border-radius: 6px;
    padding: 0.3rem 0.7rem;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .report-btn:hover{ background: var(--orange-deep); }
  .form-box{
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.7rem;
    background: #FBF8EF;
  }
  .form-title{ font-size: 0.82rem; color: var(--ink-soft); margin: 0 0 0.5rem; }
  .form-title strong{ color: var(--green-deep); }
  .error-box{
    border: 1px solid #E5BE98;
    background: #FBF1E6;
    color: var(--orange-deep);
    border-radius: 10px;
    padding: 1.2rem;
    text-align: center;
  }
  .error-box p{ margin: 0 0 0.8rem; }
  .error-box .save-btn{ width:auto; margin:0; }

  .status-line{
    position: fixed;
    left: 50%;
    bottom: 1rem;
    transform: translateX(-50%);
    max-width: calc(100% - 2rem);
    margin: 0;
    padding: 0.6rem 1rem;
    border-radius: 8px;
    background: var(--green-deep);
    color: #F1EEE0;
    font-size: 0.82rem;
    font-family: 'IBM Plex Mono', monospace;
    text-align: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    z-index: 10;
  }
  .status-line:empty{ display:none; }
  .status-line.error{ background: var(--orange-deep); }
  .loading{
    text-align:center;
    padding: 3rem 1rem;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
  }
  footer{
    text-align:center;
    color: var(--ink-soft);
    font-size: 0.78rem;
    margin-top: 2rem;
    padding: 0 1.25rem;
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <p class="eyebrow">Fältschema · trafikräkning</p>
    <div class="counter-row">
      <div class="odometer" id="odometer">
        <div class="digit">0</div><div class="digit">0</div><div class="digit">0</div>
      </div>
      <span class="counter-label" id="counterLabel">pass bokade av 210</span>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="loading" id="loading">Laddar passlistan …</div>
</main>

<p class="status-line" id="statusLine"></p>

<footer>Ändringar sparas direkt och syns för alla som öppnar länken.</footer>

<script>
const WEEKS = [
  { label: "Vecka 28", start: "2026-07-06", end: "2026-07-12" },
  { label: "Vecka 29", start: "2026-07-13", end: "2026-07-19" },
  { label: "Vecka 30", start: "2026-07-20", end: "2026-07-26" },
  { label: "Vecka 31", start: "2026-07-27", end: "2026-08-02" },
  { label: "Vecka 32", start: "2026-08-03", end: "2026-08-09" },
  { label: "Vecka 33", start: "2026-08-10", end: "2026-08-16" },
  { label: "Vecka 34", start: "2026-08-17", end: "2026-08-23" }
];

const PASSES = [
  { nr: 1, time: "08.30–10.00" },
  { nr: 2, time: "10.00–11.30" },
  { nr: 3, time: "11.30–13.00" },
  { nr: 4, time: "13.00–14.30" },
  { nr: 5, time: "14.30–16.00" },
  { nr: 6, time: "16.00–17.30" }
];

const WEEKDAYS = ["söndag","måndag","tisdag","onsdag","torsdag","fredag","lördag"];
const MONTHS = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];

// ---- JSONBin-konfiguration ----
// Fyll i dina egna värden från jsonbin.io här:
const JSONBIN_BIN_ID = "6a426bdcf5f4af5e29418862";
const JSONBIN_API_KEY = "$2a$10$z4XVLCwQ63D1qr.7VvFhm.gF4tjN6cNstupu5ZE5IySGlo9YKbAsi";
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

function parseDate(s){
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function addDays(date, n){
  const d = new Date(date);
  d.setDate(d.getDate()+n);
  return d;
}
function fmtKey(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}
function fmtDisplay(date){
  return `${WEEKDAYS[date.getDay()]} ${date.getDate()} ${MONTHS[date.getMonth()]}`;
}

function buildDays(){
  const weeks = [];
  for(const w of WEEKS){
    const start = parseDate(w.start);
    const end = parseDate(w.end);
    const days = [];
    let cur = start;
    while(cur <= end){
      days.push({ key: fmtKey(cur), display: fmtDisplay(cur) });
      cur = addDays(cur,1);
    }
    weeks.push({ label: w.label, range: `${w.start.slice(8)}–${w.end.slice(8)} ${MONTHS[parseDate(w.end).getMonth()]}`.replace(/^0/,""), days });
  }
  return weeks;
}

const WEEK_DATA = buildDays();
const TOTAL_SLOTS = WEEK_DATA.reduce((a,w)=>a+w.days.length,0) * PASSES.length;

const COUNT_FIELDS = [
  { id: "passages",        label: "Antal passager" },
  { id: "perCar",          label: "Antal passagerare per bil" },
  { id: "buses_count",     label: "Antal bussar" },
  { id: "serviceVehicles", label: "Antal tjänstefordon" },
  { id: "idpVehicles",     label: "Antal IDP-fordon", full: true }
];

let signups = {};
let openWeekIndex = -1;
let openDays = new Set();
let activeForm = null;   // { key, mode: "book" | "report" }
let drafts = {};         // osparad text per formulär, överlever omritning
let busy = false;

function slotKey(dayKey, passNr){ return `${dayKey}__${passNr}`; }

function fieldValue(entry, id){
  if(!entry) return "";
  if(id === "buses_count") return entry.buses_count || entry.buses || "";
  return entry[id] || "";
}
function hasCounts(entry){
  return COUNT_FIELDS.some(f => fieldValue(entry, f.id));
}
function slotState(entry){
  if(!entry || !entry.name) return "free";
  return hasCounts(entry) ? "done" : "booked";
}

// ---- Server ----
async function fetchLatest(){
  const res = await fetch(`${JSONBIN_URL}/latest`, {
    headers: { "X-Master-Key": JSONBIN_API_KEY, "X-Bin-Meta": "false" },
    cache: "no-store"
  });
  if(!res.ok) throw new Error("Kunde inte hämta data");
  const data = await res.json();
  return (data && typeof data === "object" && !Array.isArray(data)) ? data : {};
}

async function putAll(data){
  const res = await fetch(JSONBIN_URL, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_API_KEY },
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error("Kunde inte spara");
}

// Hämtar alltid senaste versionen precis innan sparning, så att vi aldrig
// skriver över andras ändringar med en gammal kopia från sidladdningen.
// apply(aktuellPostPåServern) returnerar { entry } (null = ta bort) eller { conflict: "meddelande" }.
async function mutate(key, apply){
  let latest;
  try{
    latest = await fetchLatest();
  }catch(e){
    return { ok: false, msg: "Kunde inte nå servern. Inget sparades, försök igen." };
  }
  const result = apply(latest[key]);
  if(result.conflict){
    signups = latest;
    return { ok: false, msg: result.conflict };
  }
  const next = { ...latest };
  if(result.entry === null) delete next[key];
  else next[key] = result.entry;
  try{
    await putAll(next);
  }catch(e){
    signups = latest;
    return { ok: false, msg: "Kunde inte spara. Försök igen." };
  }
  signups = next;
  return { ok: true };
}

let statusTimer = null;
function setStatus(msg, isError){
  const el = document.getElementById("statusLine");
  el.textContent = msg;
  el.classList.toggle("error", !!isError);
  clearTimeout(statusTimer);
  if(msg){
    statusTimer = setTimeout(()=>{ el.textContent = ""; }, isError ? 7000 : 3000);
  }
}

function updateCounter(){
  const filled = Object.values(signups).filter(v => v && v.name).length;
  const digits = String(filled).padStart(3,"0").split("");
  const odo = document.getElementById("odometer");
  odo.innerHTML = digits.map(d=>`<div class="digit">${d}</div>`).join("");
  document.getElementById("counterLabel").textContent = `pass bokade av ${TOTAL_SLOTS}`;
}

async function runAction(key, apply, successMsg){
  if(busy) return;
  busy = true;
  render();
  const res = await mutate(key, apply);
  busy = false;
  if(res.ok){
    activeForm = null;
    delete drafts[key];
    setStatus(successMsg, false);
  }else{
    setStatus(res.msg, true);
  }
  updateCounter();
  render();
}

// ---- Formulär ----
function getDraft(key, entry){
  if(!drafts[key]){
    const d = { name: entry && entry.name ? entry.name : "" };
    COUNT_FIELDS.forEach(f => d[f.id] = fieldValue(entry, f.id));
    drafts[key] = d;
  }
  return drafts[key];
}

function buildBookForm(key, pass, day){
  const draft = getDraft(key, null);
  const id = `f-${key}-name`;
  const form = document.createElement("form");
  form.className = "form-box";
  form.innerHTML = `
    <p class="form-title">Boka <strong>pass ${pass.nr}</strong>, ${day.display}. Siffrorna fyller du i efter passet.</p>
    <div class="field">
      <label for="${id}">Namn</label>
      <input type="text" id="${id}" name="name" placeholder="Ditt namn" maxlength="40" autocomplete="name" value="${escapeHtml(draft.name)}" data-autofocus>
    </div>
    <div class="form-actions">
      <button class="save-btn" type="submit" ${busy ? "disabled" : ""}>${busy ? "Bokar …" : "Boka passet"}</button>
      <button class="cancel-btn" type="button">Avbryt</button>
    </div>`;
  const input = form.querySelector("input");
  input.addEventListener("input", ()=>{ draft.name = input.value; });
  form.querySelector(".cancel-btn").addEventListener("click", ()=>{
    activeForm = null; delete drafts[key]; render();
  });
  form.addEventListener("submit", (e)=>{
    e.preventDefault();
    const name = input.value.trim();
    if(!name){ input.focus(); return; }
    runAction(key, (cur)=>{
      if(cur && cur.name) return { conflict: `Pass ${pass.nr}, ${day.display} hann precis bokas av ${cur.name}.` };
      return { entry: { name } };
    }, `Bokat: ${name}, pass ${pass.nr}, ${day.display}.`);
  });
  return form;
}

function buildReportForm(key, pass, day, entry){
  const draft = getDraft(key, entry);
  const isEdit = hasCounts(entry);
  const form = document.createElement("form");
  form.className = "form-box";
  form.innerHTML = `
    <p class="form-title"><strong>${escapeHtml(entry.name)}</strong>, ${isEdit ? "ändra siffror" : "rapportera siffror"} för pass ${pass.nr}</p>
    <div class="field-grid">
      ${COUNT_FIELDS.map((f, i) => `
        <div class="field${f.full ? " field-full" : ""}">
          <label for="f-${key}-${f.id}">${f.label}</label>
          <input type="text" id="f-${key}-${f.id}" name="${f.id}" inputmode="numeric" value="${escapeHtml(draft[f.id])}" ${i === 0 ? "data-autofocus" : ""}>
        </div>`).join("")}
    </div>
    <div class="form-actions">
      <button class="save-btn" type="submit" ${busy ? "disabled" : ""}>${busy ? "Sparar …" : "Spara siffror"}</button>
      <button class="cancel-btn" type="button">Avbryt</button>
    </div>`;
  form.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("input", ()=>{ draft[inp.name] = inp.value; });
  });
  form.querySelector(".cancel-btn").addEventListener("click", ()=>{
    activeForm = null; delete drafts[key]; render();
  });
  form.addEventListener("submit", (e)=>{
    e.preventDefault();
    const values = {};
    COUNT_FIELDS.forEach(f => values[f.id] = form.elements[f.id].value.trim());
    const bookedName = entry.name;
    runAction(key, (cur)=>{
      if(!cur || !cur.name) return { conflict: "Bokningen finns inte längre, den har tagits bort av någon annan." };
      if(cur.name !== bookedName) return { conflict: `Passet är nu bokat av ${cur.name}.` };
      const next = { ...cur, ...values };
      delete next.buses; // gammalt fältnamn, ersatt av buses_count
      return { entry: next };
    }, `Sparat: siffror för pass ${pass.nr}, ${day.display}.`);
  });
  return form;
}

// ---- Rendering ----
function render(){
  const main = document.getElementById("main");
  main.innerHTML = "";

  WEEK_DATA.forEach((week, wi)=>{
    const filledInWeek = week.days.reduce((a,d)=> a + PASSES.filter(p=>slotState(signups[slotKey(d.key,p.nr)]) !== "free").length, 0);
    const totalInWeek = week.days.length * PASSES.length;

    const weekEl = document.createElement("div");
    weekEl.className = "week" + (wi === openWeekIndex ? " open" : "");

    const head = document.createElement("button");
    head.className = "week-head";
    head.type = "button";
    head.setAttribute("aria-expanded", wi === openWeekIndex ? "true" : "false");
    head.innerHTML = `
      <span class="week-title"><span class="label">${week.label}</span><span class="range">${week.range}</span></span>
      <span style="display:flex; align-items:center; gap:0.7rem;">
        <span class="week-meta">${filledInWeek}/${totalInWeek} bokade</span>
        <span class="chev">▶</span>
      </span>`;
    head.addEventListener("click", ()=>{
      openWeekIndex = (openWeekIndex === wi) ? -1 : wi;
      render();
    });

    const body = document.createElement("div");
    body.className = "week-body";

    week.days.forEach(day=>{
      const dayEl = document.createElement("div");
      const isOpen = openDays.has(day.key);
      dayEl.className = "day" + (isOpen ? " open" : "");

      const states = PASSES.map(p => slotState(signups[slotKey(day.key,p.nr)]));
      const bookedInDay = states.filter(s => s !== "free").length;
      const missingInDay = states.filter(s => s === "booked").length;

      const dayHead = document.createElement("button");
      dayHead.className = "day-head";
      dayHead.type = "button";
      dayHead.setAttribute("aria-expanded", isOpen ? "true" : "false");
      dayHead.innerHTML = `<span>${day.display}</span><span class="day-meta"><span class="day-count">${bookedInDay}/${PASSES.length} bokade${missingInDay ? ` · ${missingInDay} utan siffror` : ""}</span><span class="day-chev">▶</span></span>`;
      dayHead.addEventListener("click", ()=>{
        if(openDays.has(day.key)) openDays.delete(day.key);
        else openDays.add(day.key);
        render();
      });
      dayEl.appendChild(dayHead);

      const list = document.createElement("div");
      list.className = "pass-list";

      PASSES.forEach(pass=>{
        const key = slotKey(day.key, pass.nr);
        const entry = signups[key];
        const state = slotState(entry);
        const form = activeForm && activeForm.key === key ? activeForm.mode : null;

        const card = document.createElement("div");
        card.className = "pass-card";

        const ph = document.createElement("div");
        ph.className = "pass-head";
        let right = "";
        if(state === "free" && !form) right = `<span class="free-label">Ledigt</span><button class="book-btn" type="button">Boka</button>`;
        else if(state === "booked") right = `<span class="badge badge-booked">Väntar på siffror</span>`;
        else if(state === "done") right = `<span class="badge badge-done">Klart</span>`;
        ph.innerHTML = `<span class="pnr">Pass ${pass.nr}</span><span>${pass.time}</span><span class="spacer"></span>${right}`;
        const bookBtn = ph.querySelector(".book-btn");
        if(bookBtn){
          bookBtn.addEventListener("click", ()=>{
            activeForm = { key, mode: "book" };
            render();
          });
        }
        card.appendChild(ph);

        if(form === "book" && state === "free"){
          card.appendChild(buildBookForm(key, pass, day));
        }else if(form === "report" && state !== "free"){
          card.appendChild(buildReportForm(key, pass, day, entry));
        }else if(state !== "free"){
          const box = document.createElement("div");
          box.className = "slot-filled" + (state === "booked" ? " booked" : "");
          const countsHtml = state === "done"
            ? `<div class="counts">${COUNT_FIELDS.map(f => `${f.label}: ${fieldValue(entry, f.id) ? escapeHtml(fieldValue(entry, f.id)) : "—"}`).join("<br>")}</div>`
            : `<div class="missing">Inga siffror rapporterade än.</div>`;
          box.innerHTML = `
            <div>
              <span class="name">${escapeHtml(entry.name)}</span>
              ${countsHtml}
            </div>
            <div class="slot-actions">
              ${state === "booked"
                ? `<button class="report-btn" type="button">Rapportera siffror</button>`
                : `<button class="edit-btn" type="button">ändra siffror</button>`}
              <button class="remove-btn" type="button">ta bort</button>
            </div>`;
          box.querySelector(".report-btn, .edit-btn").addEventListener("click", ()=>{
            activeForm = { key, mode: "report" };
            render();
          });
          box.querySelector(".remove-btn").addEventListener("click", ()=>{
            const name = entry.name;
            const extra = state === "done" ? "\n\nDe rapporterade siffrorna försvinner också." : "";
            if(!confirm(`Ta bort bokningen för ${name} (pass ${pass.nr}, ${day.display})?${extra}`)) return;
            runAction(key, (cur)=>{
              if(!cur || !cur.name) return { entry: null };
              if(cur.name !== name) return { conflict: `Passet har bokats om av ${cur.name}, inget togs bort.` };
              return { entry: null };
            }, `Borttaget: ${name}, pass ${pass.nr}, ${day.display}.`);
          });
          card.appendChild(box);
        }

        list.appendChild(card);
      });

      dayEl.appendChild(list);
      body.appendChild(dayEl);
    });

    weekEl.appendChild(head);
    weekEl.appendChild(body);
    main.appendChild(weekEl);
  });

  // Fokusera nyöppnat formulär (bara om det inte redan har fokus i ett fält)
  const af = main.querySelector("[data-autofocus]");
  if(af && !busy && document.activeElement === document.body){
    af.focus();
  }
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML.replace(/"/g, "&quot;");
}

function showLoadError(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="error-box">
      <p>Kunde inte hämta passlistan. Kontrollera uppkopplingen och försök igen.</p>
      <button class="save-btn" type="button">Försök igen</button>
    </div>`;
  main.querySelector("button").addEventListener("click", init);
}

async function init(){
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading">Laddar passlistan …</div>`;
  try{
    signups = await fetchLatest();
  }catch(e){
    // Visa aldrig en tom lista vid fel, då ser allt ledigt ut och bokningar kan krocka.
    showLoadError();
    return;
  }
  updateCounter();
  render();
}

init();
</script>
</body>
</html>
